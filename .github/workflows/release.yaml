name: "Release dev container features & Generate Documentation"
on:
  workflow_dispatch:

jobs:
  deploy:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Publish Features and generate documentation
        uses: devcontainers/action@v1
        with:
          publish-features: "true"
          base-path-to-features: "./src"
          generate-docs: "true"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create PR for documentation
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git add src/codex/README.md
          if git diff --cached --quiet; then
            echo "Generated documentation is already up to date."
            exit 0
          fi
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git config user.name 'github-actions[bot]'
          branch="automated-documentation-update-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git checkout -b "$branch"
          git commit -m 'Update Codex Feature documentation [skip ci]'
          git push --set-upstream origin "$branch"
          gh pr create --base main --head "$branch" \
            --title 'Update Codex Feature documentation' \
            --body 'Regenerate the Codex Feature README from its metadata and notes.'
