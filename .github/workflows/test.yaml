name: "CI - Test Codex Feature"
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-autogenerated:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        baseImage:
          - debian:bookworm-slim
          - ubuntu:24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Dev Containers CLI
        run: npm install -g @devcontainers/cli
      - name: Test root user and host bind mount
        run: ./test/run.sh --skip-scenarios --base-image '${{ matrix.baseImage }}'

  test-scenarios:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Dev Containers CLI
        run: npm install -g @devcontainers/cli
      - name: Test vscode and node users
        run: ./test/run.sh --skip-autogenerated --skip-duplicated
