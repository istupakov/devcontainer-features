name: "Validate Codex Feature"
on:
  push:
    branches:
      - main
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate Feature metadata
        uses: devcontainers/action@v1
        with:
          validate-only: "true"
          base-path-to-features: "./src"

      - name: Check extension option and shell syntax
        run: |
          python3 - <<'PYTHON'
          import json
          from pathlib import Path
          feature = json.loads(Path("src/codex/devcontainer-feature.json").read_text())
          assert feature["options"]["installExtension"]["default"] is False
          assert "customizations" not in feature
          assert feature["postAttachCommand"] == "/usr/local/bin/codex-devcontainer-install-extension"
          PYTHON
          sh -n src/codex/install.sh
          sh -n src/codex/install-extension.sh
          for script in test/run.sh test/codex/*.sh; do
            bash -n "$script"
          done

      - name: Test optional extension installation
        run: python3 test/extension_test.py
